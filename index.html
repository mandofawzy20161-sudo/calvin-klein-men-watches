<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calvin Klein رجالي | Original Watches EG</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f7f7f7;color:#111}
.wrap{max-width:1200px;margin:auto;padding:16px}h1{text-align:center;margin:8px 0 18px}
#search{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:white;border:1px solid #e3e3e3;border-radius:12px;padding:11px;text-align:center;position:relative;overflow:hidden}
.card img.main{width:100%;height:250px;object-fit:contain;cursor:pointer;background:#fff}
.badge,.oos{position:absolute;top:9px;z-index:2;color:white;border-radius:7px;padding:5px 8px;font-size:12px;font-weight:700}
.badge{right:9px;background:#111}.oos{left:9px;background:#a00000}
.name{font-weight:700;line-height:1.45;margin:9px 0;min-height:42px}.price{font-size:20px;font-weight:800;margin:7px}
.note{font-size:13px;margin:4px}.btn,.wa,.phone{display:block;width:100%;padding:11px;border:0;border-radius:9px;margin-top:8px;text-decoration:none;font-weight:700;cursor:pointer}
.btn{background:#eee;color:#111}.wa{background:#25d366;color:#fff}.phone{background:#111;color:#fff}
#details{display:none;background:#fff;border-radius:12px;padding:15px}
#mainImage{width:100%;max-height:520px;object-fit:contain}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.thumb{width:72px;height:72px;border:1px solid #ddd;border-radius:9px;padding:3px;background:#fff;cursor:pointer}
.thumb.active{border:2px solid #111}.thumb img{width:100%;height:100%;object-fit:contain}
table{width:100%;border-collapse:collapse;margin-top:10px;display:table!important}
td{border:1px solid #ddd;padding:12px;font-size:14px}td:first-child{font-weight:700;width:42%;background:#fafafa}
.back{background:#ddd;color:#111}
.warn{background:#ffe8e8;color:#940000;padding:12px;border-radius:9px;font-weight:700;margin:10px 0}
@media(max-width:800px){
  .wrap{padding:6px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px}
  .card{padding:6px}.card img.main{height:150px}.name{font-size:13px;min-height:38px}.price{font-size:16px}
  .note,.btn,.wa,.phone{font-size:12px}
}
</style>
</head>

nx.elshroukwatches.com/wp-content/uploads/2024/07/photoroom_000_20240702_201703.jpeg","https://cdnx.elshroukwatches.com/wp-content/uploads/2024/07/photoroom_003_20240702_201703.jpeg","https://cdnx.elshroukwatches.com/wp-content/uploads/2024/07/photoroom_002_20240702_201703.jpeg","https://cdnx.elshroukwatches.com/wp-content/uploads/2024/07/photoroom_001_20240702_201703.jpeg","https://cdnx.elshroukwatches.com/wp-content/uploads/2024/07/img_2060.jpeg","https://cdnx.elshroukwatches.com/wp-content/uploads/2024/07/img_2061.jpeg","https://cdnx.elshroukwatches.com/wp-content/uploads/2024/07/img_2062.jpeg"],"specs":[["البراند","Calvin Klein"],["الموديل","K8M27121"],["الفئة","رجالي"],["الحالة","غير متوفر حاليًا"],["الضمان","سنتان — شامل عيوب الصناعة والماكينة"],["التوصيل","مجاني"],["المعاينة","يوجد معاينة للمنتج قبل الاستلام"]]},{"name":"ساعة كالفن كلاين رجالي K2G2714N","model":"K2G2714N","price":6200.0,"stock":false,"images":["https://cdnx.elshroukwatches.com/wp-content/uploads/2023/05/k2g2714n-calvin-klein-watch-men-blue-dial-stainless-steel-metal-silver-strap-quartz-analog-chronograph-ck-city.jpg","https://cdnx.elshroukwatches.com/wp-content/uploads/2023/05/k2g2714n-calvin-klein-watch-men-blue-dial-stainless-steel-metal-silver-strap-quartz-analog-chronograph-ck-city_8.jpg","https://cdnx.elshroukwatches.com/wp-content/uploads/2023/05/k2g2714n-calvin-klein-watch-men-blue-dial-stainless-steel-metal-silver-strap-quartz-analog-chronograph-ck-city_4.jpg","https://cdnx.elshroukwatches.com/wp-content/uploads/2023/05/k2g2714n-calvin-klein-watch-men-blue-dial-stainless-steel-metal-silver-strap-quartz-analog-chronograph-ck-city_6.jpg","https://cdnx.elshroukwatches.com/wp-content/uploads/2023/05/k2g2714n-calvin-klein-watch-men-blue-dial-stainless-steel-metal-silver-strap-quartz-analog-chronograph-ck-city_10.jpg","https://cdnx.elshroukwatches.com/wp-content/uploads/2023/05/k2g2714n-calvin-klein-watch-men-blue-dial-stainless-steel-metal-silver-strap-quartz-analog-chronograph-ck-city_11. const WA="201011926183", TEL="01011926183";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function productCard(p,i){
  const im=(p.images&&p.images[0])||"";
  return `<div class="card">
    <span class="badge">ORIGINAL</span>
    ${p.stock?"":'<span class="oos">غير متوفر</span>'}
    <img class="main" loading="lazy" src="${esc(im)}" alt="${esc(p.name)}" data-open="${i}">
    <div class="name">${esc(p.name)}</div>
    <div class="price">${Math.round(p.price)} جنيه</div>
    <div class="note">🚚 التوصيل مجاني</div>
    <div class="note">📦 يوجد معاينة للمنتج قبل الاستلام</div>
    <button class="btn" type="button" data-open="${i}">تفاصيل</button>
    ${p.stock?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent("أريد طلب ساعة Calvin Klein موديل "+p.model+" بسعر "+Math.round(p.price)+" جنيه")}">اطلب عبر واتساب</a>`:""}
  </div>`;
}

function render(list=P){
  $("grid").innerHTML=list.map(p=>productCard(p,P.indexOf(p))).join("");
}

$("search").addEventListener("input",e=>{
  const q=e.target.value.trim().toLowerCase();
  render(P.filter(p=>(p.name+" "+p.model).toLowerCase().includes(q)));
});

document.addEventListener("click",e=>{
  const opener=e.target.closest("[data-open]");
  if(opener){openProduct(Number(opener.dataset.open));return}
  const th=e.target.closest("[data-thumb]");
  if(th){changeImage(Number(th.dataset.pi),Number(th.dataset.thumb),th);return}
  if(e.target.closest("[data-back]"))backToCatalog();
});

function changeImage(pi,ii,btn){
  const p=P[pi];
  if(!p || !p.images || !p.images[ii]) return;
  $("mainImage").src=p.images[ii];
  document.querySelectorAll(".thumb").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
}

function openProduct(i){
  const p=P[i]; if(!p)return;
  const gallery=(p.images&&p.images.length)?p.images:[""];
  $("catalog").style.display="none";
  $("details").style.display="block";
  $("details").innerHTML=`
    <button class="btn back" type="button" data-back>← رجوع للمنتجات</button>
    <img id="mainImage" src="${esc(gallery[0])}" alt="${esc(p.name)}">
    <div class="thumbs">
      ${gallery.map((img,j)=>`<button class="thumb ${j===0?"active":""}" type="button" data-pi="${i}" data-thumb="${j}"><img loading="lazy" src="${esc(img)}" alt="صورة ${j+1}"></button>`).join("")}
    </div>
    <h2>${esc(p.name)}</h2>
    <div class="price">${Math.round(p.price)} جنيه</div>
    ${p.stock?"":'<div class="warn">هذا الموديل غير متوفر حاليًا</div>'}
    <h3>مواصفات الساعة</h3>
    <table>${p.specs.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table>
    ${p.stock?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent("أريد طلب ساعة Calvin Klein موديل "+p.model+" بسعر "+Math.round(p.price)+" جنيه")}">اطلب عبر واتساب</a>`:""}
    <a class="phone" href="tel:${TEL}">☎ اطلب عن طريق الهاتف — ${TEL}</a>`;
  window.scrollTo(0,0);
}
function backToCatalog(){
  $("details").style.display="none";
  $("catalog").style.display="block";
  window.scrollTo(0,0);
}
render();
</script>
</body>
</html>
